<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #startButton {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 10000; padding: 15px 30px; font-size: 18px;
        background: #002d5e; color: white; border: none; border-radius: 8px; cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>
    <button id="startButton">Нажмите, чтобы начать</button>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
            id="ar-video" 
            src="./14363020167789.mp4" 
            loop="true" 
            crossorigin="anonymous" 
            playsinline 
            webkit-playsinline 
            muted>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#ar-video" width="1" height="1.4" position="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const startButton = document.querySelector('#startButton');
      const sceneEl = document.querySelector('a-scene');
      const video = document.querySelector('#ar-video');

      startButton.addEventListener('click', () => {
        // Запускаем систему AR
        const {systems} = sceneEl;
        systems['mindar-image-system'].start();
        
        // Магия: "прогреваем" видео при первом клике, чтобы браузер разрешил его играть
        video.play().then(() => {
            video.pause(); // Сразу ставим на паузу до нахождения маркера
        });

        startButton.style.display = 'none';
      });

      // Когда фото в объективе — включаем видео
      sceneEl.addEventListener('targetFound', () => {
        console.log("Вижу цель");
        video.play();
      });

      // Когда убрали телефон от фото — выключаем (экономим ресурсы)
      sceneEl.addEventListener('targetLost', () => {
        console.log("Цель потеряна");
        video.pause();
      });
    </script>
  </body>
</html>
