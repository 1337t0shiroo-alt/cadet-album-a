<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta charset="UTF-8">
    <title>WebAR Album</title>
    
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }

        /* Стильная кнопка запуска */
        #startButton {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10000; padding: 18px 36px; font-size: 18px; font-weight: bold;
            background: #002d5e; color: #d4af37; border: 2px solid #d4af37;
            border-radius: 50px; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-transform: uppercase; letter-spacing: 1px;
        }

        /* Кнопка управления звуком */
        #muteButton {
            position: fixed; bottom: 30px; right: 30px; z-index: 10000;
            width: 60px; height: 60px; background: rgba(0, 45, 94, 0.85);
            color: #d4af37; border: 1px solid #d4af37; border-radius: 50%;
            cursor: pointer; display: none; font-size: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Индикатор поиска */
        #scanningOverlay {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9999; color: #fff; background: rgba(0,0,0,0.6);
            padding: 8px 20px; border-radius: 20px; font-size: 14px;
            display: none; pointer-events: none; border: 1px solid rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body>

    <button id="startButton">Оживить альбом</button>
    <button id="muteButton">🔇</button>
    <div id="scanningOverlay">Наведите камеру на фотографию...</div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; filterMinCF: 0.0001; filterBeta: 0.001; uiScanning: no;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights; precision: medium;" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video 
                id="ar-video" 
                src="./14363020167789.mp4" 
                loop="true" 
                crossorigin="anonymous" 
                playsinline 
                webkit-playsinline 
                muted 
                preload="auto">
            </video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-video 
                id="ar-video-display" 
                src="#ar-video" 
                width="1" 
                height="1.42" 
                position="0 0 0">
            </a-video>
        </a-entity>
    </a-scene>

    <script>
        const startButton = document.querySelector('#startButton');
        const muteButton = document.querySelector('#muteButton');
        const overlay = document.querySelector('#scanningOverlay');
        const sceneEl = document.querySelector('a-scene');
        const video = document.querySelector('#ar-video');

        // Глобальный флаг видимости цели
        let targetVisible = false;

        // Запуск AR по клику (требование безопасности браузеров)
        startButton.addEventListener('click', () => {
            sceneEl.systems['mindar-image-system'].start();
            
            // "Прогрев" видео: пуск и мгновенная пауза
            video.play().then(() => {
                video.pause();
                video.currentTime = 0;
            }).catch(e => console.log("Video warm-up error:", e));

            startButton.style.display = 'none';
            muteButton.style.display = 'block';
            overlay.style.display = 'block';
        });

        // Управление звуком
        muteButton.addEventListener('click', () => {
            video.muted = !video.muted;
            muteButton.innerText = video.muted ? '🔇' : '🔊';
        });

        // Обработка нахождения фотографии
        sceneEl.addEventListener('targetFound', () => {
            targetVisible = true;
            overlay.style.display = 'none';
            video.play().catch(e => {
                console.log("Play error, trying again...");
                video.play();
            });
        });

        // Обработка потери фотографии из вида
        sceneEl.addEventListener('targetLost', () => {
            targetVisible = false;
            overlay.style.display = 'block';
            video.pause();
        });

        // ФУНКЦИЯ ПРОТИВ ЗАВИСАНИЯ
        // Каждую секунду проверяем: если фото в кадре, а видео не идет — перезапускаем
        setInterval(() => {
            if (targetVisible && (video.paused || video.readyState < 2)) {
                video.play();
            }
        }, 1000);

        // Принудительное воспроизведение при касании экрана (подстраховка)
        window.addEventListener('touchstart', () => {
            if (targetVisible && video.paused) {
                video.play();
            }
        });
    </script>
</body>
</html>
