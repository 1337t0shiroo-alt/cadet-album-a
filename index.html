<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      #startButton {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 10000; padding: 20px 40px; font-size: 20px;
        background: #002d5e; color: white; border: none; border-radius: 12px; cursor: pointer;
      }
      #muteButton {
        position: fixed; bottom: 20px; right: 20px; z-index: 10000;
        width: 60px; height: 60px; background: rgba(0,45,94,0.8);
        color: white; border: none; border-radius: 50%; display: none; font-size: 24px;
      }
    </style>
  </head>
  <body>
    <button id="startButton">ОЖИВИТЬ ФОТО</button>
    <button id="muteButton">🔇</button>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; filterMinCF:0.001; filterBeta: 0.01;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
            id="ar-video" 
            src="./14363020167789.mp4" 
            loop="true" 
            crossorigin="anonymous" 
            playsinline 
            webkit-playsinline 
            muted 
            preload="auto">
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video id="ar-video-display" src="#ar-video" width="1" height="1.4" position="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const startButton = document.querySelector('#startButton');
      const muteButton = document.querySelector('#muteButton');
      const sceneEl = document.querySelector('a-scene');
      const video = document.querySelector('#ar-video');

      // Исправление бага зависания текстуры
      const fixVideoFreeze = () => {
        if (!video.paused && video.readyState >= 2) {
          video.currentTime += 0.01; // Сдвигаем видео, если оно зависло
        }
      };

      startButton.addEventListener('click', () => {
        sceneEl.systems['mindar-image-system'].start();
        video.play().then(() => video.pause()); 
        startButton.style.display = 'none';
        muteButton.style.display = 'block';
      });

      muteButton.addEventListener('click', () => {
        video.muted = !video.muted;
        muteButton.innerText = video.muted ? '🔇' : '🔊';
      });

      sceneEl.addEventListener('targetFound', () => {
        video.muted = true; // Начинаем всегда без звука для стабильности
        video.play();
        // Запускаем микро-сдвиг для "проталкивания" кадров
        const timer = setInterval(() => {
          if (video.paused) clearInterval(timer);
          fixVideoFreeze();
        }, 1000);
      });

      sceneEl.addEventListener('targetLost', () => {
        video.pause();
      });

      // Принудительный старт при любом тапе по экрану
      window.addEventListener('touchstart', () => {
          if (!video.paused) return;
          video.play();
      });
    </script>
  </body>
</html>
