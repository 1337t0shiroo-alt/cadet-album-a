<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      
      /* Кнопка старта */
      #startButton {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 10000; padding: 20px 40px; font-size: 20px;
        background: #002d5e; color: white; border: none; border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.4); cursor: pointer;
      }

      /* Кнопка звука */
      #muteButton {
        position: fixed; bottom: 20px; right: 20px;
        z-index: 10000; width: 50px; height: 50px;
        background: rgba(0, 45, 94, 0.8); color: white;
        border: none; border-radius: 50%; cursor: pointer;
        display: none; /* Появится только когда видео пойдет */
        font-size: 24px; line-height: 50px; text-align: center;
      }
    </style>
  </head>
  <body>
    <button id="startButton">ЗАПУСТИТЬ АЛЬБОМ</button>
    <button id="muteButton">🔇</button>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
            id="ar-video" 
            src="./14363020167789.mp4" 
            loop="true" 
            crossorigin="anonymous" 
            playsinline 
            webkit-playsinline 
            muted> </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#ar-video" width="1" height="1.4" position="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const startButton = document.querySelector('#startButton');
      const muteButton = document.querySelector('#muteButton');
      const sceneEl = document.querySelector('a-scene');
      const video = document.querySelector('#ar-video');

      // Запуск AR
      startButton.addEventListener('click', () => {
        const {systems} = sceneEl;
        systems['mindar-image-system'].start();
        
        video.play().then(() => {
          video.pause();
          video.currentTime = 0;
        });

        startButton.style.display = 'none';
        muteButton.style.display = 'block'; // Показываем кнопку звука
      });

      // Логика кнопки звука
      muteButton.addEventListener('click', () => {
        if (video.muted) {
          video.muted = false;
          muteButton.innerText = '🔊';
        } else {
          video.muted = true;
          muteButton.innerText = '🔇';
        }
      });

      sceneEl.addEventListener('targetFound', () => {
        video.play();
      });

      sceneEl.addEventListener('targetLost', () => {
        video.pause();
      });
    </script>
  </body>
</html>
