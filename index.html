<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #startButton {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 10000; padding: 20px 40px; font-size: 20px;
        background: #002d5e; color: white; border: none; border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.4); cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="startButton">ЗАПУСТИТЬ АЛЬБОМ</button>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
            id="ar-video" 
            src="./14363020167789.mp4" 
            loop="true" 
            crossorigin="anonymous" 
            playsinline 
            webkit-playsinline 
            muted>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#ar-video" width="1" height="1.4" position="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const startButton = document.querySelector('#startButton');
      const sceneEl = document.querySelector('a-scene');
      const video = document.querySelector('#ar-video');

      // 1. Предварительная настройка видео
      video.muted = true;
      video.pause();

      startButton.addEventListener('click', () => {
        const {systems} = sceneEl;
        systems['mindar-image-system'].start();
        
        // 2. Важный жест: запускаем и тут же ставим на паузу, чтобы "разбудить" плеер
        video.play().then(() => {
          video.pause();
          video.currentTime = 0;
        }).catch(err => console.log("Ошибка запуска:", err));

        startButton.style.display = 'none';
      });

      // 3. Логика появления видео
      sceneEl.addEventListener('targetFound', () => {
        console.log("Маркер найден");
        video.muted = true; // Еще раз на всякий случай
        
        // Небольшая задержка перед игрой часто помогает стабильности
        setTimeout(() => {
            video.play().catch(e => {
                console.log("Автозапуск не удался, пробуем еще раз...");
                video.play();
            });
        }, 100);
      });

      sceneEl.addEventListener('targetLost', () => {
        video.pause();
      });

      // 4. Если пользователь тапнет по экрану во время просмотра - видео принудительно заиграет
      window.addEventListener('click', () => {
          if (video.paused) video.play();
      });
    </script>
  </body>
</html>
